{% extends "base.html" %}

{% block title %}Login - CloudOps E2E Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="avatar-icon bg-primary text-white rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark" id="login-heading">Sign In</h3>
                    <p class="text-muted small">Enter your credentials to manage resources</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}" id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin" value="{{ username or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" id="login-submit-btn">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate
                    </button>
                </form>

                <div class="mt-4 p-3 bg-light rounded-3 border">
                    <div class="small fw-bold text-secondary mb-1"><i class="bi bi-info-circle me-1"></i> Demo Test Accounts:</div>
                    <ul class="list-unstyled mb-0 small text-muted">
                        <li><code>admin</code> / <code>Admin@123</code></li>
                        <li><code>qa_tester</code> / <code>Testing!2024</code></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
